<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងបណ្ណាល័យឌីជីថល - ភូមិភាគស្ទឹងត្រែង</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Moul&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #1565C0;
            --secondary-color: #0D47A1;
            --accent-color: #E65100;
            --bg-color: #F4F6F9;
            --text-color: #2C3E50;
            --sidebar-color: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        h1, h2, h3 {
            color: var(--secondary-color);
        }

        .moul-text {
            font-family: 'Moul', serif;
            color: #D32F2F;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* --- ផ្នែកទម្រង់ទូទៅ (Auth Containers) --- */
        .auth-container {
            max-width: 550px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(21, 101, 192, 0.3);
        }

        .required::after {
            content: " *";
            color: red;
        }

        /* ជួរដេកទម្រង់ពីរទន្ទឹមគ្នា */
        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--secondary-color);
        }

        .switch-form {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .switch-form a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }

        /* --- ផ្នែកផ្ទៃ Dashboard ក្រោយពេល Login រួច --- */
        #dashboard-page {
            display: none; /* លាក់ទុកសិន ទាល់តែ Login ទើបបង្ហាញ */
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-box {
            display: flex;
            flex: 1;
        }

        /* របារចំហៀង (Sidebar Navigation) */
        nav {
            width: 260px;
            background: var(--sidebar-color);
            color: #94A3B8;
            padding: 20px 0;
        }

        nav ul {
            list-style: none;
        }

        nav ul li {
            padding: 12px 20px;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.3s;
            font-size: 14px;
        }

        nav ul li:hover, nav ul li.active {
            background: #334155;
            color: white;
            border-left: 4px solid #38BDF8;
        }

        /* តំបន់បង្ហាញមាតិកា (Content Area) */
        .content {
            flex: 1;
            padding: 30px;
            background: var(--bg-color);
        }

        .tab-content {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .tab-content.active {
            display: block;
        }

        /* កាតបង្ហាញសៀវភៅ ឬទិន្នន័យ */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .book-card {
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            overflow: hidden;
            background: white;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .book-cover {
            width: 100%;
            height: 220px;
            background: #E2E8F0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748B;
        }

        .book-info {
            padding: 10px;
            font-size: 14px;
        }

        .badge {
            background: #E2E8F0;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: inline-block;
            margin-top: 5px;
        }

        /* ប៊ូតុងបញ្ចូលឯកសារ */
        .btn-add {
            background: #10B981;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        /* តារាងទិន្នន័យ */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table, th, td {
            border: 1px solid #CBD5E1;
        }

        th, td {
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #F1F5F9;
        }
    </style>
</head>
<body>

    <div id="signup-page" class="auth-container">
        <h2 class="moul-text" style="font-size: 18px; margin-bottom: 5px;">មជ្ឈមណ្ឌលគរុកោសល្យភូមិភាគឦសានខេត្តស្ទឹងត្រែង</h2>
        <h3 style="text-align:center; margin-bottom: 20px; font-size: 16px;">ចុះឈ្មោះបង្កើតគណនីថ្មី</h3>
        
        <form onsubmit="event.preventDefault(); handleSignUp();">
            <div class="form-row">
                <div class="form-group">
                    <label class="required">នាមត្រកូល</label>
                    <input type="text" id="reg-lastname" required placeholder="ឧ. សុខ">
                </div>
                <div class="form-group">
                    <label class="required">នាមខ្លួន</label>
                    <input type="text" id="reg-firstname" required placeholder="ឧ. តារា">
                </div>
            </div>

            <div class="form-group">
                <label class="required">តួនាទីរបស់អ្នក</label>
                <select id="role-select" onchange="handleRoleChange()" required>
                    <option value="">--សូមជ្រើសរើសតួនាទី--</option>
                    <option value="director">គ្រូនាយក</option>
                    <option value="lecturer">គ្រូឧទ្ទេស</option>
                    <option value="librarian">គ្រូបណ្ណារក្ស</option>
                    <option value="trainee">គរុសិស្ស</option>
                </select>
            </div>

            <div class="form-group" id="generation-option" style="display: none; background: #E0F2FE; padding: 12px; border-radius: 6px; border-left: 4px solid var(--primary-color);">
                <label class="required" style="color: var(--secondary-color);">គរុសិស្សជំនាន់ទី</label>
                <input type="number" id="trainee-gen" placeholder="ឧ. ៤០">
            </div>

            <div class="form-group" id="librarian-options" style="display: none; background: #FFF3E0; padding: 10px; border-radius: 6px;">
                <label class="required" style="color: var(--accent-color);">ប្រភេទបណ្ណារក្ស (ត្រូវការការអនុញ្ញាតពី Admin)</label>
                <select id="lib-type">
                    <option value="new">បណ្ណារក្សថ្មី</option>
                    <option value="change">ផ្លាស់ប្តូរបណ្ណារក្ស</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="required">អត្តសញ្ញាណប័ណ្ណ / ID គ្រូ-សិស្ស</label>
                    <input type
